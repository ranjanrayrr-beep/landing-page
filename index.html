<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>indoor plants</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <h1>Green Home</h1>
        <p>Beautiful Indoor Plants for your home</p>
    
    </header>

    <div class = "money plant">
        <h2>Money Plant</h2>
       
         
        <p>Beautiful and easy to grow</p>
        <h4>Rs. 100/ per plant with pot</h4>
        
        <br><br>

    </div>

    <div>

        <h2>Order Form</h2><br>

        <img id = "moneyplant" src="moneyplant.jpg" width = "200px" alt=""><br><br>

        <form id = "orderForm" >
            <label for="name">Name</label>
            <input type="name" id="name" placeholder =  "Enter your name">
            <br><br>
            <label for="email">email</label>
            <input type="email" id="email" placeholder =  "Enter your email">
            <br><br>
            <label for="phone">phone</label>
            <input type="phone" id="phone" placeholder =  "Enter your ph.no.">
            <br><br>
            <label for="quantity">no.of plants</label>
            <input type="quantity" id="quantity" placeholder =  "Enter  no.of plants">
            <br><br>
            <label for="message">Message:</label><br><br>
            <textarea name="message" id="message" cols="20" rows="5">Enter your Message</textarea>
            <br><br>
            <button id="clickbtn">order now</button><br><br>
        
        </form>

    </div>

    

    

    

    <script src="custom.js"></script>

    
</body>
</html>
