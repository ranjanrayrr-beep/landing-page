<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>contact page</h1>
        <h3>place your order</h3>
        <nav>
            <a href="index.html">Home page</a>
            <a href="contact.html">contact page</a>
            <a href="gallery.html">Gallery page</a>
            <a href="care.html">Care page</a>
            <a href="privacy.html">Privacy page</a>
        
        </nav>
    </header>
    <br><br>

    <div class= "contact-container">
        <h2>Place your order</h2>
        <p>Order your favourite indoor plants</p>


        <form id = "orderForm" >
            <label for="plant">Plant Name:</label>
            <input type="text" id = "plant" name = "plant" readonly required>
            <br><br>
            <label for="name">your Name</label>
            <input type="text" id= "name" name= "name" required>
            <br><br>
            <label for="email">email</label>
            <input type="email" id = "email" name= "email" placeholder =  "Enter your email">
            <br><br>
            <label for="ph.no.">ph.no.</label>
            <input type="tel" id = "phone" placeholder =  "Enter your ph.no.">
            <br><br>
            <label for="no.of plants">no.of plants</label>
            <input type="number" id = "quantity" placeholder =  "Enter your no.of plants">
            <br><br>
            <label for="message">Message:</label><br><br>
            <textarea name="message" id="message" cols="10" rows="5">Enter your Message</textarea>
            <br><br>
            <button type = "submit">order now</button>
        
        </form>


    </div>

    <script src="custom.js"></script>

</body>
 
</html>
